<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View1 Studio — Agent Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ===================================================================
     STYLES
     =================================================================== -->
<style>
/* -- CSS Variables --------------------------------------------------- */
:root {
  --bg: #09090B;
  --surface-1: #18181B;
  --surface-2: #27272A;
  --surface-3: #3F3F46;
  --border: #27272A;
  --border-subtle: #1e1e22;
  --accent: #4ADE80;
  --accent-dim: rgba(74, 222, 128, 0.15);
  --cyan: #06B6D4;
  --cyan-dim: rgba(6, 182, 212, 0.15);
  --text-primary: #FAFAFA;
  --text-secondary: #A1A1AA;
  --text-muted: #71717A;
  --running: #22C55E;
  --completed: #3B82F6;
  --failed: #EF4444;
  --idle: #71717A;
  --p0: #EF4444;
  --p1: #F97316;
  --p2: #3B82F6;
  --p3: #71717A;
  --radius: 8px;
  --sidebar-w: 220px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

[data-theme="light"] {
  --bg: #FAFAFA;
  --surface-1: #FFFFFF;
  --surface-2: #F4F4F5;
  --surface-3: #E4E4E7;
  --border: #E4E4E7;
  --border-subtle: #F0F0F2;
  --text-primary: #09090B;
  --text-secondary: #52525B;
  --text-muted: #A1A1AA;
}

/* -- Reset & Base ---------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
button { font-family: var(--font); cursor: pointer; border: none; outline: none; }
input, select, textarea {
  font-family: var(--font);
  background: var(--surface-2);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 13px;
  outline: none;
  transition: border-color 150ms;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

/* -- Layout ---------------------------------------------------------- */
.app { display: flex; height: 100vh; }

/* -- Sidebar --------------------------------------------------------- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width 150ms;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar.collapsed { width: 52px; }
.sidebar-header {
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  min-height: 53px;
}
.sidebar-header .logo {
  width: 20px; height: 20px;
  background: var(--accent);
  border-radius: 4px;
  flex-shrink: 0;
}
.sidebar-header .title {
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar.collapsed .title,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .sidebar-footer-text { display: none; }
.sidebar.collapsed .nav-item span { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }

.sidebar-toggle {
  position: absolute;
  top: 16px;
  left: calc(var(--sidebar-w) - 12px);
  width: 24px; height: 24px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  font-size: 12px;
  z-index: 10;
  transition: left 150ms;
}
.sidebar.collapsed ~ .sidebar-toggle { left: 40px; }

.nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-label {
  padding: 16px 16px 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 150ms, color 150ms;
  border-left: 2px solid transparent;
  position: relative;
  white-space: nowrap;
}
.nav-item:hover { background: var(--surface-2); color: var(--text-primary); }
.nav-item.active {
  border-left-color: var(--accent);
  color: var(--text-primary);
  background: var(--accent-dim);
}
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active svg { opacity: 1; }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}

/* -- Main Content ---------------------------------------------------- */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
  min-height: 49px;
}
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 500;
}
.sync-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--running);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* -- Page container -------------------------------------------------- */
.page { display: none; }
.page.active { display: block; }

/* -- Cards ----------------------------------------------------------- */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: border-color 150ms;
}
.card:hover { border-color: var(--surface-3); }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* -- Stats ----------------------------------------------------------- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
.stat-value { font-size: 28px; font-weight: 700; line-height: 1.2; }

/* -- Buttons --------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  transition: background 150ms, opacity 150ms;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface-3); }
.btn-sm { padding: 4px 8px; font-size: 12px; }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text-primary); }
.btn-danger { background: #7F1D1D; color: #FCA5A5; }
.btn-danger:hover { background: #991B1B; }
.btn-cyan { background: var(--cyan); color: #000; }
.btn-cyan:hover { opacity: 0.9; }

/* -- Badges ---------------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}
.badge-p0 { background: rgba(239,68,68,0.15); color: #FCA5A5; }
.badge-p1 { background: rgba(249,115,22,0.15); color: #FDBA74; }
.badge-p2 { background: rgba(59,130,246,0.15); color: #93C5FD; }
.badge-p3 { background: rgba(113,113,122,0.15); color: #A1A1AA; }
.badge-running { background: rgba(34,197,94,0.15); color: #86EFAC; }
.badge-completed { background: rgba(59,130,246,0.15); color: #93C5FD; }
.badge-failed { background: rgba(239,68,68,0.15); color: #FCA5A5; }
.badge-idle { background: rgba(113,113,122,0.15); color: #A1A1AA; }

/* -- Status Dot ------------------------------------------------------ */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.status-dot.running { background: var(--running); animation: pulse 2s infinite; }
.status-dot.completed { background: var(--completed); }
.status-dot.failed { background: var(--failed); }
.status-dot.idle { background: var(--idle); }

/* -- Grid Layouts ---------------------------------------------------- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1200px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* -- Dashboard Grid -------------------------------------------------- */
.dash-grid-top { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.dash-grid-bottom { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
@media (max-width: 1200px) {
  .dash-grid-top { grid-template-columns: 1fr 1fr; }
  .dash-grid-bottom { grid-template-columns: 1fr; }
}
@media (max-width: 900px) { .dash-grid-top { grid-template-columns: 1fr; } }

/* -- Agent Card ------------------------------------------------------ */
.agent-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
  transition: border-color 150ms;
}
.agent-card:hover { border-color: var(--accent); }
.agent-card .agent-name { font-weight: 600; font-size: 13px; }
.agent-card .agent-dept { font-size: 11px; color: var(--text-muted); }
.agent-card .agent-task { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* -- Agent Roster Card (wider) --------------------------------------- */
.agent-roster-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  width: 350px;
  cursor: pointer;
  transition: border-color 150ms;
}
.agent-roster-card:hover { border-color: var(--accent); }

/* -- Tabs ------------------------------------------------------------ */
.tabs {
  display: flex;
  gap: 2px;
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 2px;
  width: fit-content;
}
.tab-btn {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  transition: all 150ms;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }

/* -- Filter Bar ------------------------------------------------------ */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
  flex-wrap: wrap;
}
.filter-bar input, .filter-bar select {
  padding: 6px 10px;
  font-size: 12px;
  min-width: 120px;
}
.filter-bar input[type="text"] { min-width: 200px; }

/* -- Kanban ---------------------------------------------------------- */
.kanban {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 12px;
  min-height: 400px;
}
.kanban-col {
  min-width: 280px;
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.kanban-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  border-bottom: 2px solid var(--border);
  margin-bottom: 8px;
}
.kanban-col-header .count {
  background: var(--surface-3);
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.kanban-cards {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 60px;
  padding: 4px;
  border-radius: var(--radius);
  transition: background 150ms;
}
.kanban-cards.drag-over { background: var(--accent-dim); }
.kanban-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  cursor: grab;
  transition: border-color 150ms, transform 150ms;
  font-size: 13px;
}
.kanban-card:hover { border-color: var(--surface-3); }
.kanban-card.dragging { opacity: 0.5; transform: rotate(2deg); }
.kanban-card .kc-title { font-weight: 500; margin-bottom: 4px; }
.kanban-card .kc-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.4; }
.kanban-card .kc-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kanban-card .kc-assignee {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: #000;
}
.kanban-card .kc-labels { display: flex; gap: 3px; }
.kanban-card .kc-label-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.kanban-card .kc-due { font-size: 10px; color: var(--text-muted); }
.kanban-card .blocked-icon { color: var(--failed); font-size: 12px; }
.kanban-add {
  margin-top: 4px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: var(--radius);
  transition: background 150ms;
}
.kanban-add:hover { background: var(--surface-2); color: var(--text-primary); }
.kanban-add-form {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px;
  display: none;
  flex-direction: column;
  gap: 6px;
}
.kanban-add-form.show { display: flex; }

/* -- Table ----------------------------------------------------------- */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table thead th {
  text-align: left;
  padding: 8px 10px;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.data-table thead th:hover { color: var(--text-primary); }
.data-table thead th .sort-arrow { font-size: 10px; margin-left: 4px; }
.data-table tbody tr {
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: background 150ms;
  height: 40px;
}
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table td { padding: 8px 10px; }

/* -- Timeline -------------------------------------------------------- */
.timeline-container {
  overflow-x: auto;
  position: relative;
  min-height: 300px;
}
.timeline-header {
  display: flex;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 2;
}
.timeline-day {
  min-width: 40px;
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
  padding: 4px 0;
  border-right: 1px solid var(--border-subtle);
}
.timeline-day.today { color: var(--failed); font-weight: 700; }
.timeline-body { position: relative; }
.timeline-row {
  display: flex;
  align-items: center;
  height: 32px;
  position: relative;
  border-bottom: 1px solid var(--border-subtle);
}
.timeline-row-label {
  width: 120px;
  flex-shrink: 0;
  font-size: 11px;
  color: var(--text-secondary);
  padding: 0 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.timeline-row-track { flex: 1; position: relative; height: 100%; }
.timeline-bar {
  position: absolute;
  height: 20px;
  top: 6px;
  border-radius: 4px;
  font-size: 10px;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.timeline-bar.status-backlog { background: var(--idle); }
.timeline-bar.status-todo { background: var(--surface-3); }
.timeline-bar.status-in_progress { background: var(--completed); }
.timeline-bar.status-review { background: #A78BFA; }
.timeline-bar.status-done { background: var(--running); }
.timeline-bar.blocked {
  background: repeating-linear-gradient(45deg, var(--failed), var(--failed) 4px, #7F1D1D 4px, #7F1D1D 8px);
}
.timeline-today-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--failed);
  z-index: 1;
}

/* -- Activity Feed --------------------------------------------------- */
.activity-list { display: flex; flex-direction: column; gap: 2px; }
.activity-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius);
  font-size: 13px;
  transition: background 150ms;
}
.activity-item:hover { background: var(--surface-2); }
.activity-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 12px;
}
.activity-text { flex: 1; }
.activity-text .action { font-weight: 500; }
.activity-text .details { color: var(--text-secondary); }
.activity-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.activity-day-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  padding: 12px 10px 4px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* -- Calendar -------------------------------------------------------- */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.cal-day-header {
  background: var(--surface-1);
  padding: 8px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
}
.cal-day {
  background: var(--surface-1);
  min-height: 110px;
  padding: 6px;
  cursor: pointer;
  transition: background 150ms;
}
.cal-day:hover { background: var(--surface-2); }
.cal-day.other-month { opacity: 0.4; }
.cal-day.today { background: var(--accent-dim); }
.cal-day-num { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
.cal-task-badge {
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 3px;
  margin-bottom: 2px;
  display: block;
  cursor: pointer;
  transition: opacity 150ms;
  line-height: 1.3;
}
.cal-task-badge:hover { opacity: 0.8; }
.cal-task-badge .cal-badge-meta {
  font-size: 9px;
  opacity: 0.8;
  display: block;
}
.cal-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.cal-nav .month-label { font-size: 16px; font-weight: 600; min-width: 180px; text-align: center; }
.cal-main { flex: 1; min-width: 0; }
.cal-day-detail {
  margin-top: 16px;
  padding: 16px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: none;
}
.cal-day-detail.show { display: block; }

/* -- Category Colors ------------------------------------------------- */
.cat-infrastructure { background: rgba(59,130,246,0.25); color: #93C5FD; }
.cat-auth { background: rgba(167,139,250,0.25); color: #C4B5FD; }
.cat-ai { background: rgba(74,222,128,0.25); color: #86EFAC; }
.cat-ui { background: rgba(6,182,212,0.25); color: #67E8F9; }
.cat-payments { background: rgba(249,115,22,0.25); color: #FDBA74; }
.cat-gallery { background: rgba(236,72,153,0.25); color: #F9A8D4; }
.cat-default { background: var(--surface-3); color: var(--text-secondary); }

/* -- Roadmap --------------------------------------------------------- */
.roadmap-phase {
  margin-bottom: 16px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.roadmap-phase-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.roadmap-phase-name { font-weight: 600; font-size: 14px; }
.roadmap-progress-bar {
  height: 6px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
}
.roadmap-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 300ms; }

/* -- Modal / Slide-over ---------------------------------------------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: none;
  justify-content: flex-end;
}
.modal-overlay.open { display: flex; }
.modal-panel {
  width: 450px;
  max-width: 90vw;
  background: var(--surface-1);
  border-left: 1px solid var(--border);
  height: 100%;
  overflow-y: auto;
  padding: 24px;
  animation: slideIn 200ms ease;
}
@keyframes slideIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
}
.modal-field { margin-bottom: 16px; }
.modal-field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.modal-field input, .modal-field select, .modal-field textarea { width: 100%; }
.modal-field textarea { min-height: 80px; resize: vertical; }
.modal-title-input {
  font-size: 20px;
  font-weight: 700;
  border: none;
  background: transparent;
  color: var(--text-primary);
  width: 100%;
  padding: 0;
  margin-bottom: 16px;
}
.modal-title-input:focus { outline: none; border-bottom: 1px solid var(--accent); }
.modal-section {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.modal-section:last-child { border-bottom: none; }
.modal-section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--cyan);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 10px;
}

/* -- Tags ------------------------------------------------------------ */
.tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--surface-3);
  border-radius: 12px;
  font-size: 11px;
  color: var(--text-secondary);
}
.tag .tag-remove { cursor: pointer; opacity: 0.6; }
.tag .tag-remove:hover { opacity: 1; }

/* -- Shimmer / Loading ----------------------------------------------- */
.shimmer {
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.shimmer-line { height: 14px; margin-bottom: 8px; }
.shimmer-block { height: 80px; }

/* -- Agent HQ -------------------------------------------------------- */
.hq-connection-banner {
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hq-connection-banner.connected { background: rgba(34,197,94,0.1); color: var(--running); border: 1px solid rgba(34,197,94,0.2); }
.hq-connection-banner.disconnected { background: rgba(239,68,68,0.1); color: var(--failed); border: 1px solid rgba(239,68,68,0.2); }

.hq-compact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.hq-compact-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hq-compact-card .hq-emoji { font-size: 20px; }

/* -- Charts ---------------------------------------------------------- */
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 200px; padding: 0 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bar {
  width: 100%;
  background: var(--accent);
  border-radius: 4px 4px 0 0;
  transition: height 300ms;
  min-height: 2px;
}
.bar-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; text-align: center; }
.bar-value { font-size: 10px; color: var(--text-secondary); margin-bottom: 2px; }

/* -- Sprint ---------------------------------------------------------- */
.sprint-item {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  margin-bottom: 8px;
}
.sprint-name { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
.sprint-dates { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.sprint-capacity-bar {
  height: 6px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
}
.sprint-capacity-fill { height: 100%; background: var(--accent); border-radius: 3px; }

/* -- Positioning Chart ----------------------------------------------- */
.pos-chart {
  position: relative;
  width: 100%;
  height: 400px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pos-axis-x, .pos-axis-y {
  position: absolute;
  font-size: 10px;
  color: var(--text-muted);
}
.pos-dot {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.pos-label {
  position: absolute;
  font-size: 10px;
  color: var(--text-secondary);
  transform: translate(-50%, 10px);
  white-space: nowrap;
}

/* -- Confirm Dialog -------------------------------------------------- */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 400px;
  text-align: center;
}
.confirm-box p { margin-bottom: 16px; font-size: 14px; }
.confirm-actions { display: flex; gap: 8px; justify-content: center; }

/* -- Section Headers ------------------------------------------------- */
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* -- Collapsible Dept ------------------------------------------------ */
.dept-section { margin-bottom: 20px; }
.dept-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.dept-header:hover { color: var(--accent); }
.dept-header .dept-name { font-weight: 600; font-size: 14px; }
.dept-header .dept-meta { font-size: 12px; color: var(--text-muted); }
.dept-agents { display: flex; flex-wrap: wrap; gap: 12px; }
.dept-agents.collapsed { display: none; }

/* -- Steps list ------------------------------------------------------ */
.steps-list { list-style: none; counter-reset: step; }
.steps-list li {
  counter-increment: step;
  padding: 6px 0;
  font-size: 13px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.steps-list li::before {
  content: counter(step);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  background: var(--cyan-dim);
  color: var(--cyan);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}

/* -- Phase roadmap horizontal ---------------------------------------- */
.phase-timeline {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  overflow-x: auto;
}
.phase-timeline-item {
  flex: 1;
  min-width: 200px;
  padding: 16px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  position: relative;
}
.phase-timeline-item:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.phase-timeline-item:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.phase-timeline-item.active { border-color: var(--accent); background: var(--accent-dim); }

/* -- Feature comparison table ---------------------------------------- */
.feature-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.feature-table th, .feature-table td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
}
.feature-table th {
  font-weight: 600;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
}
.feature-table .check { color: var(--running); }
.feature-table .cross { color: var(--failed); }

/* -- Cost form ------------------------------------------------------- */
.cost-form {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  margin-top: 12px;
}
.cost-form input { flex: 1; }
</style>
</head>

/* =====================================================================
   STATUS NORMALIZER
   ===================================================================== */
function normalizeAgentStatus(s) {
  if (!s) return 'idle';
  const l = s.toLowerCase().trim();
  if (['running','active','in_progress'].includes(l)) return 'running';
  if (['completed','complete','done'].includes(l)) return 'completed';
  if (['failed','error'].includes(l)) return 'failed';
  return 'idle';
}

   UI STATE
   ===================================================================== */
const UIState = {
  currentPage: localStorage.getItem('v1_page') || 'dashboard',
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  taskViewMode: 'kanban',
  taskSort: { field: 'sort_order', dir: 'asc' },
  taskFilters: { search: '', priority: '', assignee: '', category: '' },
  theme: localStorage.getItem('v1_theme') || 'dark',
  sidebarCollapsed: localStorage.getItem('v1_sidebar') === 'true',
  editingTaskId: null,
  collapsedDepts: {},
};

/* =====================================================================
   DATA STORE
   ===================================================================== */
const API_BASE = window.location.origin + '/api/data';

const DataStore = {
  tasks: [],
  agents: [],
  activity: [],
  notifications: [],
  sprints: [],
  lastFetch: null,
  loading: false,

  async fetchAll() {
    this.loading = true;
    updateLoadingUI(true);
    try {
      const [tasks, agents, activity, sprints] = await Promise.all([
        this.fetch('tasks', { order: 'sort_order.asc,created_at.desc', limit: 500 }),
        this.fetch('agents', { order: 'department.asc,id.asc', limit: 50 }),
        this.fetch('activity_log', { order: 'created_at.desc', limit: 50 }),
        this.fetch('sprints', { order: 'start_date.asc', limit: 20 }),
      ]);
      this.tasks = Array.isArray(tasks) ? tasks : [];
      this.agents = Array.isArray(agents) ? agents.map(a => ({ ...a, status: normalizeAgentStatus(a.status) })) : [];
      this.activity = Array.isArray(activity) ? activity : [];
      this.sprints = Array.isArray(sprints) ? sprints : [];
      this.lastFetch = new Date();
    } catch (e) {
      console.error('DataStore.fetchAll error:', e);
    }
    this.loading = false;
    updateLoadingUI(false);
  },

  async fetch(table, params = {}) {
    const qs = new URLSearchParams({ table, ...params }).toString();
    try {
      const res = await fetch(`${API_BASE}?${qs}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      console.error(`Fetch ${table} error:`, e);
      return [];
    }
  },

  async createTask(data) {
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table: 'tasks', action: 'insert', data }),
      });
      const result = await res.json();
      if (Array.isArray(result) && result.length) this.tasks.push(result[0]);
      return result;
    } catch (e) {
      console.error('createTask error:', e);
      return null;
    }
  },

  async updateTask(id, data) {
    data.updated_at = new Date().toISOString();
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table: 'tasks', action: 'update', data, match: `id=eq.${id}` }),
      });
      const result = await res.json();
      const idx = this.tasks.findIndex(t => t.id === id);
      if (idx >= 0 && Array.isArray(result) && result.length) {
        this.tasks[idx] = { ...this.tasks[idx], ...result[0] };
      }
      return result;
    } catch (e) {
      console.error('updateTask error:', e);
      return null;
    }
  },

  async deleteTask(id) {
    try {
      await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table: 'tasks', action: 'delete', match: `id=eq.${id}` }),
      });
      this.tasks = this.tasks.filter(t => t.id !== id);
    } catch (e) {
      console.error('deleteTask error:', e);
    }
  },

  isBlocked(task) {
    if (!task.dependencies && !task.depends_on) return false;
    const deps = task.depends_on || task.dependencies;
    if (!Array.isArray(deps) || deps.length === 0) return false;
    return deps.some(depId => {
      const dep = this.tasks.find(t => t.id === depId);
      return dep && dep.status !== 'done';
    });
  },
};

/* =====================================================================
   UTILITY HELPERS
   ===================================================================== */
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const s = Math.floor((Date.now() - d) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateFull(dateStr) {
  if (!dateStr) return '-';
  return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function dayKey(d) {
  return d.toISOString().split('T')[0];
}

function getInitials(name) {
  if (!name) return '?';
  return name.split('-').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function priorityClass(p) {
  return 'badge-' + (p || 'p3');
}

function getCategoryStyle(cat) {
  if (!cat) return CATEGORY_COLORS['infrastructure'] || { bg: 'var(--surface-3)', color: 'var(--text-secondary)' };
  const key = cat.toLowerCase();
  return CATEGORY_COLORS[key] || { bg: 'var(--surface-3)', color: 'var(--text-secondary)' };
}

function updateLoadingUI(loading) {
  const badge = document.getElementById('loadingBadge');
  if (badge) badge.style.display = loading ? 'inline-flex' : 'none';
}

function getFilteredTasks() {
  const f = UIState.taskFilters;
  return DataStore.tasks.filter(t => {
    if (f.search && !((t.title || '').toLowerCase().includes(f.search.toLowerCase()) ||
        (t.description || '').toLowerCase().includes(f.search.toLowerCase()))) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (f.assignee && t.assignee !== f.assignee) return false;
    if (f.category && t.category !== f.category) return false;
    return true;
  });
}

function applyFilters() {
  UIState.taskFilters.search = document.getElementById('filterSearch').value;
  UIState.taskFilters.priority = document.getElementById('filterPriority').value;
  UIState.taskFilters.assignee = document.getElementById('filterAssignee').value;
  UIState.taskFilters.category = document.getElementById('filterCategory').value;
  renderTaskView();
}

  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));

  const titles = {
    dashboard: 'Dashboard', tasks: 'Tasks', calendar: 'Calendar',

    strategy: 'Strategy', analytics: 'Analytics', costs: 'Costs', settings: 'Settings',

function renderDashboard() {
  const agents = DataStore.agents;

  const activity = DataStore.activity;

  const running = agents.filter(a => a.status === 'running').length;
  const inProg = tasks.filter(t => t.status === 'in_progress').length;

  // Today's tasks
  const todayStr = dayKey(new Date());

    (t.due_date && t.due_date.startsWith(todayStr)) || t.status === 'in_progress'
  ).slice(0, 8);

    <div class="card">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <div class="stat-label">Agents Running</div>
          <div style="font-size:24px;font-weight:700;color:var(--accent);">${running}</div>
        </div>
        <div>
          <div class="stat-label">Tasks In Progress</div>
          <div style="font-size:24px;font-weight:700;color:var(--cyan);">${inProg}</div>
        </div>
        <div>
          <div class="stat-label">Done / Total</div>

        </div>
        <div>
          <div class="stat-label">PRs Open</div>
          <div style="font-size:24px;font-weight:700;">${prsOpen}</div>
        </div>
      </div>
    </div>
  `;

  // Agent Status Card
  html += `
    <div class="card">
      <div class="card-header"><div class="card-title">Agent Status</div></div>
      <div style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;">
        ${agents.length ? agents.map(a => {
          const meta = AGENT_META[a.id];
          const emoji = meta ? meta.emoji : '\u{1F916}';
          const taskText = a.current_task ? (a.current_task.length > 35 ? a.current_task.slice(0, 35) + '...' : a.current_task) : 'Idle';
          return `
            <div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;">
              <span class="status-dot ${a.status}"></span>
              <span style="font-weight:500;min-width:80px;">${emoji} ${esc(a.name || a.id)}</span>
              <span style="color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(taskText)}</span>
            </div>
          `;
        }).join('') : '<div style="color:var(--text-muted);font-size:12px;">No agents found</div>'}
      </div>
    </div>
  `;

  // Today's Tasks Card
  html += `
    <div class="card">
      <div class="card-header"><div class="card-title">Today's Tasks</div></div>
      <div style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;">
        ${todayTasks.length ? todayTasks.map(t => `
          <div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;cursor:pointer;" onclick="openTaskModal('${t.id}')">
            <span class="badge ${priorityClass(t.priority)}" style="font-size:10px;">${(t.priority||'p3').toUpperCase()}</span>

function renderActivityFeed(containerId, items) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (!items.length) {
    container.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px;">No activity yet</div>';
    return;
  }

  let html = '';
  items.forEach(item => {
    const icon = getActivityIcon(item.action);
    html += `
      <div class="activity-item">
        <div class="activity-icon">${icon}</div>
        <div class="activity-text">
          <span class="action">${esc(item.action)}</span>
          <span class="details"> ${esc(item.details || '')}</span>
        </div>
        <div class="activity-time">${timeAgo(item.created_at)}</div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function getActivityIcon(action) {
  if (!action) return '\u26A1';
  const a = action.toLowerCase();
  if (a.includes('create') || a.includes('add')) return '\u2795';
  if (a.includes('update') || a.includes('edit') || a.includes('change')) return '\u270F\uFE0F';
  if (a.includes('delete') || a.includes('remove')) return '\u{1F5D1}';
  if (a.includes('complete') || a.includes('done')) return '\u2705';
  if (a.includes('deploy') || a.includes('push')) return '\u{1F680}';
  if (a.includes('assign')) return '\u{1F464}';
  if (a.includes('comment')) return '\u{1F4AC}';
  return '\u26A1';
}

function renderTaskView() {

/* -- Kanban ---------------------------------------------------------- */
function renderKanban() {
  const tasks = getFilteredTasks();
  const container = document.getElementById('taskView-kanban');

  let html = '<div class="kanban">';
  STATUS_COLUMNS.forEach(status => {
    const colTasks = tasks.filter(t => t.status === status);
    html += `
      <div class="kanban-col">
        <div class="kanban-col-header">
          <span>${STATUS_LABELS[status]}</span>
          <span class="count">${colTasks.length}</span>
        </div>
        <div class="kanban-cards" data-status="${status}"
             ondragover="event.preventDefault();this.classList.add('drag-over')"
             ondragleave="this.classList.remove('drag-over')"
             ondrop="handleDrop(event,'${status}');this.classList.remove('drag-over')">
          ${colTasks.map(t => renderKanbanCard(t)).join('')}
        </div>
        <div class="kanban-add" onclick="showQuickAdd(this,'${status}')">+ Add task</div>
        <div class="kanban-add-form" data-status="${status}">
          <input type="text" placeholder="Task title..." class="quick-add-title" onkeydown="if(event.key==='Enter')submitQuickAdd(this,'${status}')">
          <select class="quick-add-assignee">
            <option value="">Unassigned</option>
            ${DataStore.agents.map(a => `<option value="${esc(a.id)}">${esc(a.name || a.id)}</option>`).join('')}
          </select>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-primary btn-sm" onclick="submitQuickAdd(this.closest('.kanban-add-form').querySelector('.quick-add-title'),'${status}')">Add</button>
            <button class="btn btn-secondary btn-sm" onclick="this.closest('.kanban-add-form').classList.remove('show')">Cancel</button>
          </div>
        </div>
      </div>
    `;
  });
  html += '</div>';
  container.innerHTML = html;
}

function renderKanbanCard(t) {
  const blocked = DataStore.isBlocked(t);
  const labels = Array.isArray(t.labels) ? t.labels : [];
  const labelColors = ['#4ADE80', '#3B82F6', '#06B6D4', '#F97316', '#EF4444', '#EC4899'];
  const desc = t.description ? (t.description.length > 80 ? t.description.slice(0, 80) + '...' : t.description) : '';
  const dueStr = t.due_date ? formatDate(t.due_date) : '';

  return `
    <div class="kanban-card ${blocked ? 'blocked' : ''}" draggable="true"
         ondragstart="event.dataTransfer.setData('text/plain','${t.id}');this.classList.add('dragging')"
         ondragend="this.classList.remove('dragging')"
         onclick="openTaskModal('${t.id}')">
      <div class="kc-title">${esc(t.title)}</div>
      ${desc ? `<div class="kc-desc">${esc(desc)}</div>` : ''}
      <div class="kc-meta">
        <span class="badge ${priorityClass(t.priority)}">${(t.priority||'p3').toUpperCase()}</span>
        ${t.assignee ? `<span class="kc-assignee" title="${esc(t.assignee)}">${getInitials(t.assignee)}</span>` : ''}
        ${dueStr ? `<span class="kc-due">${dueStr}</span>` : ''}
        ${labels.length ? `<span class="kc-labels">${labels.map((l,i) => `<span class="kc-label-dot" style="background:${labelColors[i % labelColors.length]}" title="${esc(l)}"></span>`).join('')}</span>` : ''}
        ${blocked ? '<span class="blocked-icon" title="Blocked by dependency">\u{1F512}</span>' : ''}
      </div>
    </div>
  `;
}

function handleDrop(event, newStatus) {
  event.preventDefault();
  const taskId = event.dataTransfer.getData('text/plain');
  if (taskId) {
    DataStore.updateTask(taskId, { status: newStatus }).then(() => renderKanban());
  }
}

function showQuickAdd(el, status) {
  const form = el.nextElementSibling;
  form.classList.add('show');
  form.querySelector('.quick-add-title').focus();
}

function submitQuickAdd(input, status) {
  const title = input.value.trim();
  if (!title) return;
  const form = input.closest('.kanban-add-form');
  const assignee = form.querySelector('.quick-add-assignee').value;
  DataStore.createTask({
    id: crypto.randomUUID(),
    title,
    status,
    priority: 'p2',
    assignee: assignee || null,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  }).then(() => {
    input.value = '';
    form.classList.remove('show');
    renderKanban();
  });
}

/* -- Table View ------------------------------------------------------- */
function renderTable() {
  const tasks = getFilteredTasks();
  const sort = UIState.taskSort;

  const sorted = [...tasks].sort((a, b) => {
    let va = a[sort.field], vb = b[sort.field];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    let cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return sort.dir === 'desc' ? -cmp : cmp;
  });

  const arrow = (field) => sort.field === field ? (sort.dir === 'asc' ? '\u25B2' : '\u25BC') : '';

  const cols = [
    { field: 'title', label: 'Title' },
    { field: 'status', label: 'Status' },
    { field: 'priority', label: 'Priority' },
    { field: 'assignee', label: 'Assignee' },
    { field: 'due_date', label: 'Due Date' },
    { field: 'labels', label: 'Labels' },
    { field: 'time_estimate_hours', label: 'Estimate' },
    { field: 'category', label: 'Category' },
  ];

  let html = `<div style="overflow-x:auto;"><table class="data-table"><thead><tr>`;
  cols.forEach(c => {
    html += `<th onclick="sortTable('${c.field}')">${c.label} <span class="sort-arrow">${arrow(c.field)}</span></th>`;
  });
  html += `</tr></thead><tbody>`;

  sorted.forEach(t => {
    const labels = Array.isArray(t.labels) ? t.labels : [];
    html += `<tr onclick="openTaskModal('${t.id}')">
      <td style="font-weight:500;">${esc(t.title)}</td>
      <td><span class="badge badge-${t.status === 'in_progress' ? 'running' : t.status === 'done' ? 'completed' : 'idle'}">${STATUS_LABELS[t.status] || t.status}</span></td>
      <td><span class="badge ${priorityClass(t.priority)}">${(t.priority||'p3').toUpperCase()}</span></td>
      <td>${esc(t.assignee || '-')}</td>
      <td>${formatDate(t.due_date)}</td>
      <td><div class="tag-list">${labels.map(l => `<span class="tag">${esc(l)}</span>`).join('')}</div></td>
      <td>${t.time_estimate_hours != null ? t.time_estimate_hours + 'h' : '-'}</td>
      <td>${esc(t.category || '-')}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  document.getElementById('taskView-table').innerHTML = html;
}

function sortTable(field) {
  if (UIState.taskSort.field === field) {
    UIState.taskSort.dir = UIState.taskSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    UIState.taskSort.field = field;
    UIState.taskSort.dir = 'asc';
  }
  renderTable();
}

/* -- Timeline View --------------------------------------------------- */
function renderTimeline() {
  const tasks = getFilteredTasks().filter(t => t.created_at || t.due_date);
  if (!tasks.length) {
    document.getElementById('taskView-timeline').innerHTML = '<div style="color:var(--text-muted);padding:20px;">No tasks with dates to display.</div>';
    return;
  }

  const allDates = [];
  tasks.forEach(t => {
    if (t.created_at) allDates.push(new Date(t.created_at));
    if (t.due_date) allDates.push(new Date(t.due_date));
  });
  allDates.push(new Date());

  let minDate = new Date(Math.min(...allDates));
  let maxDate = new Date(Math.max(...allDates));
  minDate.setDate(minDate.getDate() - 2);
  maxDate.setDate(maxDate.getDate() + 5);

  const totalDays = Math.ceil((maxDate - minDate) / 86400000) + 1;
  const dayWidth = 40;
  const trackLeft = 120;
  const totalWidth = trackLeft + totalDays * dayWidth;
  const today = new Date();
  const todayPos = Math.floor((today - minDate) / 86400000) * dayWidth;

  const byAssignee = {};
  tasks.forEach(t => {
    const a = t.assignee || 'Unassigned';
    if (!byAssignee[a]) byAssignee[a] = [];
    byAssignee[a].push(t);
  });

  let headerHtml = `<div style="width:${trackLeft}px;flex-shrink:0;"></div>`;
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate);
    d.setDate(d.getDate() + i);
    const isToday = dayKey(d) === dayKey(today);
    headerHtml += `<div class="timeline-day ${isToday ? 'today' : ''}" style="width:${dayWidth}px;">${d.getDate()}<br>${d.toLocaleString('en', {month:'short'})}</div>`;
  }

  let rowsHtml = '';
  const taskPositions = {};
  let rowIdx = 0;

  Object.keys(byAssignee).forEach(assignee => {
    byAssignee[assignee].forEach(t => {
      const start = t.created_at ? new Date(t.created_at) : (t.due_date ? new Date(t.due_date) : new Date());
      const end = t.due_date ? new Date(t.due_date) : new Date(start.getTime() + 86400000 * 3);
      const startDay = Math.max(0, Math.floor((start - minDate) / 86400000));
      const duration = Math.max(1, Math.ceil((end - start) / 86400000));
      const left = startDay * dayWidth;
      const width = duration * dayWidth;
      const blocked = DataStore.isBlocked(t);

      taskPositions[t.id] = { x: left + width / 2, y: rowIdx * 32 + 16 };

      rowsHtml += `
        <div class="timeline-row">
          <div class="timeline-row-label" title="${esc(t.title)}">${esc(t.title)}</div>
          <div class="timeline-row-track" style="width:${totalDays * dayWidth}px;">
            <div class="timeline-bar ${blocked ? 'blocked' : 'status-' + t.status}"
                 style="left:${left}px;width:${width}px;"
                 title="${esc(t.title)} (${esc(t.assignee || 'Unassigned')})"
                 onclick="openTaskModal('${t.id}')">
              ${blocked ? '\u{1F512} ' : ''}${esc(t.title)}
            </div>
          </div>
        </div>
      `;
      rowIdx++;
    });
  });

  let svgArrows = '';
  tasks.forEach(t => {
    const deps = t.depends_on || t.dependencies;
    if (deps && Array.isArray(deps)) {
      deps.forEach(depId => {
        const from = taskPositions[depId];
        const to = taskPositions[t.id];
        if (from && to) {
          svgArrows += `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)"/>`;
        }
      });
    }
  });

  const svgHeight = rowIdx * 32;
  const svgWidth = totalDays * dayWidth;

  let html = `
    <div class="timeline-container" style="overflow-x:auto;">
      <div style="min-width:${totalWidth}px;position:relative;">
        <div class="timeline-header">${headerHtml}</div>
        <div class="timeline-body" style="position:relative;">
          ${rowsHtml}
          <div class="timeline-today-line" style="left:${trackLeft + todayPos}px;"></div>
          <svg width="${svgWidth}" height="${svgHeight}" style="position:absolute;left:${trackLeft}px;top:0;pointer-events:none;">
            <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--accent)"/></marker></defs>
            ${svgArrows}
          </svg>
        </div>
      </div>
    </div>
  `;

  document.getElementById('taskView-timeline').innerHTML = html;
}

/* -- Task Activity View ---------------------------------------------- */
function renderTaskActivity() {
  const taskIds = new Set(DataStore.tasks.map(t => t.id));
  const relevant = DataStore.activity.filter(item => {
    const meta = item.metadata;
    if (meta && meta.task_id && taskIds.has(meta.task_id)) return true;
    const details = (item.details || '').toLowerCase();
    const action = (item.action || '').toLowerCase();
    return action.includes('task') || details.includes('task');
  });

  const container = document.getElementById('taskView-activity');
  if (!relevant.length) {
    container.innerHTML = '<div style="color:var(--text-muted);padding:20px;">No task-related activity yet.</div>';
    return;
  }

  let html = '<div class="activity-list">';
  const grouped = {};
  relevant.forEach(item => {
    const d = dayKey(new Date(item.created_at));
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(item);
  });

  for (const [date, items] of Object.entries(grouped)) {
    const isToday = date === dayKey(new Date());
    html += `<div class="activity-day-header">${isToday ? 'Today' : formatDate(date)}</div>`;
    items.forEach(item => {
      html += `
        <div class="activity-item">
          <div class="activity-icon">${getActivityIcon(item.action)}</div>
          <div class="activity-text">
            <span class="action">${esc(item.action)}</span>
            <span class="details"> ${esc(item.details || '')}</span>
          </div>
          <div class="activity-time">${timeAgo(item.created_at)}</div>
        </div>
      `;
    });
  }

  html += '</div>';
  container.innerHTML = html;
}

function openNewTaskModal() {
  const id = crypto.randomUUID();
  const newTask = {
    id,
    title: 'New Task',
    status: 'backlog',
    priority: 'p2',
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };
  DataStore.createTask(newTask).then(() => {
    openTaskModal(id);
    renderTaskView();
  });
}

function closeTaskModal() {
  document.getElementById('taskModal').classList.remove('open');
  UIState.editingTaskId = null;
  renderTaskView();
}

function saveTaskField(field, value) {
  if (!UIState.editingTaskId) return;
  const data = {};
  data[field] = value;
  DataStore.updateTask(UIState.editingTaskId, data);
}

function addLabel(label) {
  if (!label.trim() || !UIState.editingTaskId) return;
  const task = DataStore.tasks.find(t => t.id === UIState.editingTaskId);
  if (!task) return;
  const labels = Array.isArray(task.labels) ? [...task.labels] : [];
  if (!labels.includes(label.trim())) {
    labels.push(label.trim());
    DataStore.updateTask(UIState.editingTaskId, { labels }).then(() => {
      task.labels = labels;
      openTaskModal(UIState.editingTaskId);
    });
  }
}

function removeLabel(label) {
  if (!UIState.editingTaskId) return;
  const task = DataStore.tasks.find(t => t.id === UIState.editingTaskId);
  if (!task) return;
  const labels = (Array.isArray(task.labels) ? task.labels : []).filter(l => l !== label);
  DataStore.updateTask(UIState.editingTaskId, { labels }).then(() => {
    task.labels = labels;
    openTaskModal(UIState.editingTaskId);
  });
}

function saveDependencies() {
  if (!UIState.editingTaskId) return;
  const select = document.getElementById('modalDeps');
  const deps = Array.from(select.selectedOptions).map(o => o.value);
  DataStore.updateTask(UIState.editingTaskId, { depends_on: deps, dependencies: deps });
}

function confirmDeleteTask() {
  if (!UIState.editingTaskId) return;
  const dialog = document.getElementById('confirmDialog');
  document.getElementById('confirmMessage').textContent = 'Are you sure you want to delete this task? This cannot be undone.';
  document.getElementById('confirmAction').textContent = 'Delete';
  document.getElementById('confirmAction').className = 'btn btn-danger';
  document.getElementById('confirmAction').onclick = () => {
    DataStore.deleteTask(UIState.editingTaskId).then(() => {
      closeConfirm();
      closeTaskModal();
      renderTaskView();
    });
  };
  dialog.classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmDialog').classList.remove('open');
}

/* =====================================================================
   RENDER: CALENDAR
   ===================================================================== */
function renderCalendar() {
  const year = UIState.calYear;
  const month = UIState.calMonth;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  document.getElementById('calMonthLabel').textContent = `${monthNames[month]} ${year}`;

  const firstDay = new Date(year, month, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const today = dayKey(new Date());

  const tasksByDate = {};
  DataStore.tasks.forEach(t => {
    if (t.due_date) {
      const k = t.due_date.split('T')[0];
      if (!tasksByDate[k]) tasksByDate[k] = [];
      tasksByDate[k].push(t);
    }
  });

  let html = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    html += `<div class="cal-day-header">${d}</div>`;
  });

  const prevMonthDays = new Date(year, month, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) {
    const day = prevMonthDays - i;
    html += `<div class="cal-day other-month"><div class="cal-day-num">${day}</div></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const key = dayKey(d);
    const isToday = key === today;
    const dayTasks = tasksByDate[key] || [];

    html += `<div class="cal-day ${isToday ? 'today' : ''}" onclick="showCalDayDetail('${key}')">
      <div class="cal-day-num">${day}</div>
      ${dayTasks.slice(0, 3).map(t => {
        const catStyle = getCategoryStyle(t.category);
        const truncTitle = t.title && t.title.length > 20 ? t.title.slice(0, 20) + '...' : (t.title || '');
        return `<div class="cal-task-badge" style="background:${catStyle.bg};color:${catStyle.color};" title="${esc(t.title)}" onclick="event.stopPropagation();openTaskModal('${t.id}')">
          ${esc(truncTitle)}
          <span class="cal-badge-meta">${(t.priority||'p3').toUpperCase()} &middot; ${esc(t.assignee || '?')} &middot; ${STATUS_LABELS[t.status] || t.status}</span>
        </div>`;
      }).join('')}
      ${dayTasks.length > 3 ? `<div style="font-size:9px;color:var(--text-muted);">+${dayTasks.length - 3} more</div>` : ''}
    </div>`;
  }

  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  }

  document.getElementById('calGrid').innerHTML = html;

  // Roadmap section below calendar
  renderCalRoadmap();
}

function showCalDayDetail(dateKey) {

function calNav(dir) {
  UIState.calMonth += dir;
  if (UIState.calMonth > 11) { UIState.calMonth = 0; UIState.calYear++; }
  if (UIState.calMonth < 0) { UIState.calMonth = 11; UIState.calYear--; }
  renderCalendar();
}

function calToday() {
  const now = new Date();
  UIState.calMonth = now.getMonth();
  UIState.calYear = now.getFullYear();
  renderCalendar();
}

function renderCalRoadmap() {
  const tasks = DataStore.tasks;
  const phases = [...new Set(tasks.map(t => t.phase).filter(Boolean))];

  if (!phases.length) {
    document.getElementById('calRoadmapSection').innerHTML = '';
    return;
  }

  let html = '<div class="section-title" style="margin-top:8px;">Roadmap Progress</div>';
  html += '<div style="display:flex;flex-direction:column;gap:12px;">';

  phases.forEach(phase => {
    const phaseTasks = tasks.filter(t => t.phase === phase);
    const done = phaseTasks.filter(t => t.status === 'done').length;
    const pct = phaseTasks.length ? Math.round(done / phaseTasks.length * 100) : 0;

    html += `
      <div class="card" style="padding:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-weight:600;font-size:13px;">${esc(phase)}</span>
          <span style="font-size:12px;color:var(--text-muted);">${done}/${phaseTasks.length} (${pct}%)</span>
        </div>
        <div class="roadmap-progress-bar"><div class="roadmap-progress-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  });

  html += '</div>';
  document.getElementById('calRoadmapSection').innerHTML = html;
}

  let html = '';
  for (const [dept, deptAgents] of Object.entries(byDept)) {

    const isCollapsed = UIState.collapsedDepts[dept] || false;

    html += `<div class="dept-section">

      const completedCount = agentTasks.filter(t => t.status === 'done').length;

      const agentActivity = DataStore.activity.filter(item => {
        const m = item.metadata;
        if (m && m.agentId === a.id) return true;
        const d = (item.details || '').toLowerCase();
        return d.includes(a.id);
      }).slice(0, 3);

      html += `
        <div class="agent-roster-card" onclick="showAgentDetail('${esc(a.id)}')">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <span style="font-size:28px;">${emoji}</span>

            <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;padding:6px 8px;background:var(--surface-2);border-radius:4px;">

    html += '</tbody></table>';
  } else {
    html += '<div style="color:var(--text-muted);font-size:13px;padding:8px;">No tasks in progress</div>';
  }
  html += '</div>';

  document.getElementById('agenthqContent').innerHTML = html;
}

  // Risks
  const risks = [
    { risk: 'AI model accuracy below 90%', severity: 'High', mitigation: 'Fine-tune with photographer datasets, allow manual corrections' },
    { risk: 'Stripe Connect compliance', severity: 'Medium', mitigation: 'Work with Stripe partner team, legal review' },
    { risk: 'Image storage costs at scale', severity: 'Medium', mitigation: 'Cloudflare Images CDN, aggressive caching, tiered storage' },
    { risk: 'Competitor launches similar AI', severity: 'Low', mitigation: 'Focus on workflow integration, not just AI' },
  ];

  html += '<div class="grid-2" style="margin-bottom:20px;">';

  // Decisions
  html += `<div class="card">
    <div class="card-header"><div class="card-title">Key Decisions</div></div>
    ${decisions.map(d => `
      <div style="padding:8px 0;border-bottom:1px solid var(--border-subtle);">
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="badge badge-completed" style="font-size:10px;">Decided</span>
          <span style="font-size:13px;font-weight:500;">${esc(d.decision)}</span>
        </div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${esc(d.reason)}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${esc(d.date)}</div>
      </div>
    `).join('')}
  </div>`;

  // Risks
  html += `<div class="card">
    <div class="card-header"><div class="card-title">Key Risks</div></div>
    ${risks.map(r => {
      const sevColor = r.severity === 'High' ? 'var(--failed)' : r.severity === 'Medium' ? 'var(--p1)' : 'var(--text-muted)';
      return `
        <div style="padding:8px 0;border-bottom:1px solid var(--border-subtle);">
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:11px;font-weight:600;color:${sevColor};">${esc(r.severity)}</span>
            <span style="font-size:13px;font-weight:500;">${esc(r.risk)}</span>
          </div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Mitigation: ${esc(r.mitigation)}</div>
        </div>
      `;
    }).join('')}
  </div>`;

  html += '</div>';

  document.getElementById('strategyContent').innerHTML = html;
}

/* =====================================================================
   RENDER: ANALYTICS
   ===================================================================== */
function renderAnalytics() {
  const agents = DataStore.agents;
  let html = '';

  // Agent Productivity Table
  html += '<div class="section-title">Agent Productivity</div>';
  html += `<div class="card" style="margin-bottom:20px;">
    <table class="data-table">
      <thead><tr><th>Agent</th><th>Department</th><th>Tasks Completed</th><th>PRs Created</th><th>Status</th></tr></thead>
      <tbody>
        ${agents.map(a => {
          const prs = DataStore.tasks.filter(t => t.assignee === a.id && t.pr_link).length;
          return `<tr>
            <td style="font-weight:500;">${esc(a.name || a.id)}</td>
            <td>${esc(a.department || '-')}</td>
            <td>${a.tasks_completed || 0}</td>
            <td>${prs}</td>
            <td><span class="badge badge-${a.status}">${a.status}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

  // API Spend
  html += '<div class="section-title">API Spend</div>';
  html += '<div class="grid-4" style="margin-bottom:20px;">';
  const apiServices = [
    { name: 'Anthropic', icon: '\u{1F9E0}', desc: 'Claude API for agent orchestration' },
    { name: 'Supabase', icon: '\u{1F5C4}\u{FE0F}', desc: 'Database, Auth, Storage' },
    { name: 'Vercel', icon: '\u25B2', desc: 'Hosting & Edge Functions' },
    { name: 'Cloudflare', icon: '\u2601\u{FE0F}', desc: 'Image CDN & transforms' },
  ];

  apiServices.forEach(svc => {
    html += `
      <div class="card">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <span style="font-size:16px;">${svc.icon}</span>
          <span class="card-title">${esc(svc.name)}</span>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">${esc(svc.desc)}</div>
        <button class="btn btn-secondary btn-sm" style="width:100%;">Connect API</button>
      </div>
    `;
  });
  html += '</div>';

  // Manual cost entry
  html += `
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header"><div class="card-title">Manual Cost Entry</div></div>
      <div class="cost-form">
        <div class="modal-field" style="margin-bottom:0;flex:2;">
          <label>Service</label>
          <input type="text" id="costServiceName" placeholder="Service name">
        </div>
        <div class="modal-field" style="margin-bottom:0;flex:1;">
          <label>Monthly Cost</label>
          <input type="number" id="costAmount" placeholder="$0" min="0" step="1">
        </div>
        <button class="btn btn-primary btn-sm" style="margin-bottom:0;" onclick="addManualCost()">Add</button>
      </div>
      <div id="manualCostsList" style="margin-top:8px;"></div>
    </div>
  `;

  // Build/Deploy
  html += `
    <div class="card">
      <div class="card-header"><div class="card-title">Build / Deploy</div></div>
      <div style="font-size:13px;color:var(--text-secondary);">
        <div style="margin-bottom:8px;">Vercel Dashboard: <a href="https://vercel.com" target="_blank">Open Vercel</a></div>
        <div>Last deploy: <span style="color:var(--text-muted);">Check Vercel dashboard</span></div>
      </div>
    </div>
  `;

  document.getElementById('analyticsContent').innerHTML = html;
}

// Simple local manual cost tracking
let manualCosts = JSON.parse(localStorage.getItem('v1_manual_costs') || '[]');

function addManualCost() {
  const name = document.getElementById('costServiceName').value.trim();
  const amount = parseFloat(document.getElementById('costAmount').value) || 0;
  if (!name) return;
  manualCosts.push({ name, amount });
  localStorage.setItem('v1_manual_costs', JSON.stringify(manualCosts));
  document.getElementById('costServiceName').value = '';
  document.getElementById('costAmount').value = '';
  renderManualCosts();
}

function renderManualCosts() {
  const container = document.getElementById('manualCostsList');
  if (!container) return;
  if (!manualCosts.length) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-muted);">No manual costs added</div>';
    return;
  }
  container.innerHTML = manualCosts.map((c, i) => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--border-subtle);">
      <span>${esc(c.name)}</span>
      <span>$${c.amount}/mo <span style="cursor:pointer;color:var(--failed);margin-left:4px;" onclick="removeManualCost(${i})">&times;</span></span>
    </div>
  `).join('');
}

function removeManualCost(idx) {
  manualCosts.splice(idx, 1);
  localStorage.setItem('v1_manual_costs', JSON.stringify(manualCosts));
  renderManualCosts();
}

/* =====================================================================
   RENDER: COSTS

    { name: 'Claude API (Anthropic)', cost: 150, plan: 'Usage-based', desc: 'AI agent orchestration', status: 'Active' },
    { name: 'Stripe', cost: 0, plan: '2.9% + 30c', desc: 'Payment processing (pass-through)', status: 'Active' },
    { name: 'GitHub', cost: 4, plan: 'Team', desc: 'Code hosting, CI/CD', status: 'Active' },
    { name: 'Domain + DNS', cost: 1, plan: 'Annual ($12/yr)', desc: 'view1.studio domain', status: 'Active' },
    { name: 'Monitoring (Sentry)', cost: 0, plan: 'Free tier', desc: 'Error tracking', status: 'Active' },

  // Total burn rate

      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="stat-label">Monthly Burn Rate</div>
          <div class="stat-value" style="color:var(--accent);">$${total}/mo</div>

        <div style="font-size:12px;color:var(--text-muted);text-align:right;">

          <span style="font-style:italic;">Auto-pull from APIs coming soon</span>

      </div>

  `;

  // Cost breakdown table
  html += '<div class="section-title">Service Breakdown</div>';
  html += `<div class="card">
    <table class="data-table">
      <thead><tr><th>Service</th><th>Monthly Cost</th><th>Plan</th><th>Status</th><th>Notes</th></tr></thead>
      <tbody>
        ${services.map(s => `
          <tr>
            <td style="font-weight:500;">${esc(s.name)}</td>
            <td style="font-weight:600;">${s.cost > 0 ? '$' + s.cost : 'Free'}</td>
            <td style="color:var(--text-muted);">${esc(s.plan)}</td>
            <td><span class="badge ${s.status === 'Active' ? 'badge-running' : 'badge-idle'}">${s.status}</span></td>
            <td style="font-size:12px;color:var(--text-muted);">${esc(s.desc)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;

  document.getElementById('costsContent').innerHTML = html;
}

/* =====================================================================
   RENDER: SETTINGS
   ===================================================================== */
function renderSettings() {
  document.getElementById('themeSelect').value = UIState.theme;
  document.getElementById('settingsLastSync').textContent = DataStore.lastFetch
    ? DataStore.lastFetch.toLocaleString()
    : 'Never';
  document.getElementById('settingsSyncStatus').textContent = DataStore.loading ? 'Syncing...' : 'Connected';
}

/* =====================================================================
   AUTO-REFRESH
   ===================================================================== */
let refreshInterval = null;

function startAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(() => {
    const p = UIState.currentPage;
    if (['dashboard', 'tasks', 'agents', 'agenthq'].includes(p)) {
      DataStore.fetchAll().then(() => {
        renderCurrentPage();
        updateSyncLabel();
      });
    }
  }, 15000);
}

function updateSyncLabel() {
  const label = document.getElementById('lastSyncLabel');
  if (DataStore.lastFetch) {
    label.textContent = 'Synced ' + timeAgo(DataStore.lastFetch.toISOString());
  }
}

/* =====================================================================
   INIT
   ===================================================================== */
document.addEventListener('DOMContentLoaded', async () => {
  // Apply saved theme
  document.documentElement.setAttribute('data-theme', UIState.theme);

  // Setup sidebar
  initSidebar();

  // Navigation click handlers
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => navigate(item.dataset.page));
  });

  // Task view tabs
  document.querySelectorAll('#taskTabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#taskTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      UIState.taskViewMode = btn.dataset.view;
      renderTaskView();
    });
  });

  // Close modal on overlay click
  document.getElementById('taskModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('taskModal')) closeTaskModal();
  });

  // Initial data fetch
  await DataStore.fetchAll();
  updateSyncLabel();

  // Navigate to saved page
  navigate(UIState.currentPage);

  // Start auto-refresh
  startAutoRefresh();
});
</script>

</html>
